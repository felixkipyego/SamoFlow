# Out-of-band maintenance batch (2026-10-17), PART D: this repo is public,
# so every PR's own new commits are scanned for secrets before merge, not
# only via ops/security/scan-secrets.sh's own ad hoc/Step 7.2 full-history
# re-run. Reuses that exact script (same pinned-by-digest gitleaks image,
# same committed .gitleaksignore) rather than duplicating its logic --
# the script's own `--log-opts` passthrough (added in this same batch)
# lets this job scan just the PR's own new commits instead of the full,
# already-reviewed history (300+ commits and growing), which would be
# slow and pointless to re-scan on every single PR.
#
# Same fork-safety discipline as every other workflow here: read-only
# GITHUB_TOKEN, no repository secrets referenced, never the target-repo-
# context trigger -- backend/tests/test_ci_guard.py's generic checks cover
# this file too, not just ci.yml/security.yml.
name: Secret scan

on:
  pull_request: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history (fetch-depth: 0), not a computed depth: GitHub
          # Actions expressions have no arithmetic operators at all --
          # `github.event.pull_request.commits + 1` (the original,
          # broken attempt here) is a YAML/expression PARSE ERROR, which
          # made the entire workflow file invalid, not merely wrong at
          # runtime (caught by CI going red on this exact line/column,
          # not by any local check -- see actionlint below). This repo's
          # history is small (~300 commits) and cheap to fetch in full;
          # the real win is correctness, not the bytes saved by a
          # narrower depth: a computed depth can under-fetch (a force-
          # push or a large rebase between trigger and checkout) and
          # silently miss the base commit, which fetch-depth: 0
          # structurally cannot do -- it always has every commit.
          fetch-depth: 0

      # The PR's base/head SHAs, not a branch name: a branch ref can move
      # between this job starting and gitleaks running, and fetch-depth: 0
      # above guarantees both SHAs resolve regardless of how the PR's own
      # history has changed since the job was triggered.
      - name: Scan the PR's own new commits for secrets
        run: |
          ./ops/security/scan-secrets.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
