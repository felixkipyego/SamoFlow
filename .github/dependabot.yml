# Task 1.1.o.g: automated dependency-update PRs for the two ecosystems
# Dependabot can actually cover safely in this repo's layout. Version
# updates only (no security-updates config here; those run on their own
# platform default regardless). No auto-merge: every PR needs a human
# review, same as any other change.
#
# Three known, deliberate gaps -- NOT configured here, and NOT safe to add
# blindly later without re-checking the reasoning below. Full investigation
# for each is recorded in PROJECT_SPEC.md, Step 1.1.o.g decisions.
#
# 1. No Python/pip/uv package-ecosystem entry for backend/: neither
#    ecosystem safely regenerates backend's hash-pinned lockfiles. Covered
#    by the manual routine in PROJECT_SPEC.md's Project constraints
#    ("Manual dependency/image maintenance routine (Step 1.1.o)").
#
# 2. No `docker` package-ecosystem entry for backend/ (only
#    `docker-compose` below): Dependabot's docker ecosystem cannot resolve
#    backend/Dockerfile's `ARG PYTHON_IMAGE=...`-substituted FROM line.
#    Covered by the same manual routine referenced above.
#
# 3. Dependabot's docker-compose ecosystem cannot auto-update the
#    `postgres` image below (deploy/docker-compose.yml's shared
#    x-postgres-image anchor): its file updater rewrites raw text with a
#    regex that never resolves YAML aliases, so it silently fails
#    (`RuntimeError: Expected content to change!`) rather than editing the
#    anchor. Covered by the same manual routine referenced above.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    groups:
      docker-compose:
        patterns:
          - "*"
    open-pull-requests-limit: 5
