# Task 1.1.i: postgres, qdrant, api, worker, plus migrate and test-db behind
# profiles. Build context is ../backend (this file's own directory is
# deploy/), producing widgetplatform-backend:dev for api/worker/migrate.
#
# Compose reads .env from THIS FILE'S OWN FOLDER (deploy/), not the repo
# root and not the caller's working directory. This repo keeps .env (and
# .env.example) at the repo root, so every command below must pass
# --env-file explicitly -- never rely on Compose finding .env by itself:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
#   docker compose --env-file .env -f deploy/docker-compose.yml run --rm migrate
#   docker compose --env-file .env -f deploy/docker-compose.yml --profile test up -d test-db

name: widgetplatform

# Application configuration, passed explicitly (no env_file:) so a missing
# variable fails Compose's own interpolation immediately with a clear
# message, instead of the app starting and failing later. Used as-is (not
# merged) for the environment: of api, worker and migrate below.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:?APP_ENV must be set in .env}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
  QDRANT_URL: ${QDRANT_URL:?QDRANT_URL must be set in .env}
  QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env}
  # Required (Task 1.4.a): signs and verifies widget session tokens.
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
  # Optional: ":-" (not ":?") -- empty is a valid "not rotating" value,
  # matching Settings' own empty-string-means-None rule.
  JWT_SIGNING_KEY_PREVIOUS: ${JWT_SIGNING_KEY_PREVIOUS:-}
  # Required (Task 2.1.a): pgcrypto passphrase for db_connections'
  # encrypted credentials.
  DB_CONNECTION_ENCRYPTION_KEY: ${DB_CONNECTION_ENCRYPTION_KEY:?DB_CONNECTION_ENCRYPTION_KEY must be set in .env}
  # Required (Task 2.2.f): the temporary admin-key mechanism, superseded
  # outright by Step 6.1's real platform_admin role.
  ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set in .env}
  # Required (Task 2.5.a): the dense-embedding primitive's own API credential.
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
  API_HOST: ${API_HOST:?API_HOST must be set in .env}
  API_PORT: ${API_PORT:?API_PORT must be set in .env}

# Hardening applied to api, worker and migrate only (our own code running
# the widgetplatform-backend image): read-only root filesystem with a tmpfs
# /tmp, all Linux capabilities dropped, no-new-privileges, and memory/pid
# limits. Not applied to postgres, qdrant or test-db, which are upstream
# images we did not audit for read-only-rootfs compatibility.
x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  mem_limit: 512m
  pids_limit: 200

# Same build, same image, for api, worker and migrate (duplication check
# after 1.1.g/h/i): one context, one tag, merged into each service below.
x-app-build: &app-build
  build:
    context: ../backend
  image: widgetplatform-backend:dev

# Shared by every healthcheck below; each service still supplies its own
# test: and merges this in for the timing (duplication check after 1.1.i).
x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 5s
  retries: 5

# postgres and test-db must always run the same Postgres version (test-db
# exists to mirror postgres for backend/tests); one anchor keeps that true
# by construction instead of by two people remembering to update both.
x-postgres-image: &postgres-image postgres:18.2-trixie

services:
  postgres:
    # Tag verified with `docker manifest inspect postgres:18.2-trixie`
    # (returned a valid manifest list) on 2026-09-20; same tag CI and the
    # Alembic integration test (1.1.h) already use.
    image: *postgres-image
    # POSTGRES_USER/PASSWORD/DB are applied only when the data volume is
    # first created; changing them later needs "down -v" (destroys data)
    # or changing the role password inside Postgres directly.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      # postgres:18.2-trixie declares its VOLUME at /var/lib/postgresql (not
      # the pre-18 .../data path) and sets PGDATA to a subdirectory of it
      # (/var/lib/postgresql/18/docker) -- verified with
      # `docker image inspect postgres:18.2-trixie --format
      # '{{json .Config.Volumes}}'` and `--format '{{json .Config.Env}}'`.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ escapes Compose's own interpolation so the literal shell
      # variables (set via environment: above) are read inside the
      # container, not substituted by Compose from the host's .env.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      <<: *healthcheck-timing
    restart: unless-stopped
    # No published ports: only other Compose services reach postgres, over
    # the default network, by service name.

  qdrant:
    # Newest stable tag verified via the Docker Hub tags API (v1.19.1 is the
    # highest vX.Y.Z tag as of 2026-09-20, i.e. not a dev/preview/branch
    # tag) and then with `docker manifest inspect qdrant/qdrant:v1.19.1`
    # (returned a valid manifest list).
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # /healthz is exempt from Qdrant's own API-key auth (confirmed live,
      # Task 1.3.a1: it answers 200 with no key, a wrong key, or the right
      # key -- unlike a real data endpoint like /collections, which returns
      # 401 without the correct key), so this check needs no change now
      # that auth is enabled.
      # The image has neither curl nor wget (checked with `which` inside
      # the image); it does have bash, so the check speaks raw HTTP to
      # qdrant's own /healthz endpoint over bash's /dev/tcp. CMD (not
      # CMD-SHELL) invokes bash directly: the image's /bin/sh is dash,
      # which does not support /dev/tcp. Revisit if the image drops bash.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'",
        ]
      <<: *healthcheck-timing
    restart: unless-stopped
    # No published ports: only other Compose services reach qdrant, over
    # the default network, by service name.

  api:
    <<: [*app-build, *app-hardening]
    command: ["api"]
    environment: *app-env
    volumes:
      # Task 2.7.a: uploaded-file storage (app/ingest/upload_storage.py),
      # shared with worker below at the identical path -- confirmed live
      # before this task that api/worker shared no volume at all until
      # now. Same path as Settings.upload_storage_path's own default, so
      # no UPLOAD_STORAGE_PATH override is needed for this to line up.
      # Not a bind mount: a named volume needs no host-side directory to
      # pre-exist, matching postgres-data's/qdrant-data's own precedent.
      - upload-storage:/data/uploads
    ports:
      # Host side fixed at 8000, bound to loopback only: nothing outside
      # this machine can reach the API directly (a reverse proxy is a later
      # deployment task).
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      # The image has no curl (Task 1.1.g); Python's stdlib urllib is
      # already on PATH via the app's own venv, so no extra tool is needed.
      # Task 1.4.j: checks /ready, not /health -- /ready actually touches
      # Postgres (a bounded "SELECT 1", app/health.py), so this healthcheck
      # now reflects whether the api service can actually serve a request
      # that needs the database, not just that the process is alive.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).status == 200 else 1)",
        ]
      <<: *healthcheck-timing
    restart: unless-stopped

  worker:
    <<: [*app-build, *app-hardening]
    command: ["worker"]
    environment: *app-env
    volumes:
      # Task 2.7.a: same shared volume as api's own above, same path --
      # see that comment for why. This is what makes it SHARED: both
      # services mount the identical named volume at the identical path.
      - upload-storage:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      # The worker has no HTTP server (unlike the api service's own /ready
      # above), so this checks a file-based heartbeat instead (Task 2.1.f):
      # app/worker.py's own run() loop writes HEARTBEAT_PATH at the start
      # of every iteration, including an idle one with nothing to claim.
      # Same no-curl-in-the-image convention as api's own healthcheck --
      # one shared function, check_heartbeat_fresh(), not duplicated
      # shell-script freshness logic that could drift from the real one.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import sys; from app.worker import check_heartbeat_fresh; sys.exit(0 if check_heartbeat_fresh() else 1)",
        ]
      <<: *healthcheck-timing
    restart: unless-stopped

  migrate:
    <<: [*app-build, *app-hardening]
    command: ["migrate"]
    environment: *app-env
    # Not part of `up`: this is a deploy step, run explicitly with
    #   docker compose --env-file .env -f deploy/docker-compose.yml run --rm migrate
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      # Task 2.1.g: migrate now also runs ensure_collection() (app/qdrant.py)
      # after `alembic upgrade head`, so it needs qdrant healthy too, same as
      # api/worker below -- otherwise `docker compose run --rm migrate` run
      # before `up` (or standalone) would race a not-yet-ready Qdrant.
      qdrant:
        condition: service_healthy
    restart: "no"

  test-db:
    # Same pinned image as postgres above; a separate, disposable instance
    # for backend/tests' integration tests (Task 1.1.h), never used by
    # api/worker/migrate.
    image: *postgres-image
    profiles: ["test"]
    environment:
      # Test-only credentials, written literally (not from .env): this
      # database is throwaway, localhost-only, and never holds real data.
      POSTGRES_USER: widgetplatform
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: widgetplatform_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      # Same path as postgres's named volume above (the image's declared
      # VOLUME) -- tmpfs instead of a named volume, so nothing persists
      # across restarts.
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widgetplatform -d widgetplatform_test"]
      <<: *healthcheck-timing
    restart: "no"

  test-qdrant:
    # Same tag as qdrant above, but written as a literal, not the anchor
    # pattern postgres/test-db use: qdrant has no second in-file consumer of
    # this tag, and the 1.1.o.g Dependabot bug (its docker-compose updater
    # cannot rewrite a YAML-anchored image line, "Expected content to
    # change!") is reason enough on its own to avoid anchors here even if
    # there were one. Task 1.3.a2's guard test (backend/tests/
    # test_hardening_guard.py) is the actual drift protection, checking this
    # literal against qdrant's own literal above.
    image: qdrant/qdrant:v1.19.1
    profiles: ["test"]
    environment:
      # Test-only key, written literally (not from .env): this Qdrant is
      # throwaway, localhost-only, and never holds real data -- same spirit
      # as test-db's literal Postgres credentials above.
      QDRANT__SERVICE__API_KEY: test-qdrant-key
    ports:
      - "127.0.0.1:56333:6333"
    tmpfs:
      # Same path as qdrant's named volume above (its declared VOLUME) --
      # tmpfs instead of a named volume, so nothing persists across restarts.
      - /qdrant/storage
    healthcheck:
      # Same check as qdrant above (/healthz is auth-exempt either way).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'",
        ]
      <<: *healthcheck-timing
    restart: "no"

volumes:
  postgres-data:
  qdrant-data:
  # Task 2.7.a: shared between api and worker only (not migrate -- it
  # never touches uploads); named, not bind-mounted, matching the two
  # volumes above.
  upload-storage:
