# Task 1.1.i: postgres, qdrant, api, worker, plus migrate and test-db behind
# profiles. Build context is ../backend (this file's own directory is
# deploy/), producing widgetplatform-backend:dev for api/worker/migrate.
#
# Compose reads .env from THIS FILE'S OWN FOLDER (deploy/), not the repo
# root and not the caller's working directory. This repo keeps .env (and
# .env.example) at the repo root, so every command below must pass
# --env-file explicitly -- never rely on Compose finding .env by itself:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
#   docker compose --env-file .env -f deploy/docker-compose.yml run --rm migrate
#   docker compose --env-file .env -f deploy/docker-compose.yml --profile test up -d test-db

name: widgetplatform

# Application configuration, passed explicitly (no env_file:) so a missing
# variable fails Compose's own interpolation immediately with a clear
# message, instead of the app starting and failing later. Used as-is (not
# merged) for the environment: of api, worker and migrate below.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:?APP_ENV must be set in .env}
  # [SECURITY] L2 (Phase 7 role split, 2026-10-18): the APP role -- least
  # privilege, no DDL. Used at runtime by api/worker (app/db.py, app/
  # agent/checkpointer.py's live pool); migrate never calls database_url_
  # str() itself, but Settings requires the field present regardless.
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
  QDRANT_URL: ${QDRANT_URL:?QDRANT_URL must be set in .env}
  QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env}
  # Required (Task 3.1.b): retrieve()'s own least-privilege, server-
  # enforced read-only credential, separate from QDRANT_API_KEY above.
  QDRANT_READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:?QDRANT_READ_ONLY_API_KEY must be set in .env}
  # Required (Task 1.4.a): signs and verifies widget session tokens.
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
  # Optional: ":-" (not ":?") -- empty is a valid "not rotating" value,
  # matching Settings' own empty-string-means-None rule.
  JWT_SIGNING_KEY_PREVIOUS: ${JWT_SIGNING_KEY_PREVIOUS:-}
  # Required (Task 2.1.a): pgcrypto passphrase for db_connections'
  # encrypted credentials.
  DB_CONNECTION_ENCRYPTION_KEY: ${DB_CONNECTION_ENCRYPTION_KEY:?DB_CONNECTION_ENCRYPTION_KEY must be set in .env}
  # Required (Task 2.5.a): the dense-embedding primitive's own API credential.
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
  # Optional (Task 3.4.a): the secondary chat-model provider -- ":-" (not
  # ":?"), matching JWT_SIGNING_KEY_PREVIOUS's own identical "empty is a
  # valid not-configured value" treatment above.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  API_HOST: ${API_HOST:?API_HOST must be set in .env}
  API_PORT: ${API_PORT:?API_PORT must be set in .env}
  # Optional (Step 4.5): tracing is wired up by app/main.py's own
  # lifespan hook (the api service only -- worker/migrate never run
  # the chat graph or call retrieve(), so there is nothing in either
  # process this instrumentation would capture; present here anyway,
  # unused by worker/migrate, only because this one anchor is shared
  # across all three and an unused Settings value is harmless). ":-"
  # (not ":?"): absent is a valid "tracing disabled" value, the same
  # shape ANTHROPIC_API_KEY above already uses.
  PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-}
  # [SECURITY] L1 PART C (#7) (out-of-band Phase 7 batch, 2026-10-17):
  # the SAME API_HOSTNAME env var deploy/Caddyfile already reads for its
  # own {$API_HOSTNAME} site block -- one source of truth, read a second
  # time here so app/main.py's TrustedHostMiddleware (production only)
  # validates against the real value instead of a second, hand-copied
  # one. ":-" (not ":?"): unset is a valid "no Caddy in front yet" value
  # in development/test -- Settings._require_api_hostname_in_production
  # (app/config.py) is what makes this mandatory, and only under
  # APP_ENV=production.
  API_HOSTNAME: ${API_HOSTNAME:-}
  # [SECURITY] L1 PART C follow-up (advisor review, 2026-10-17): the SAME
  # DASHBOARD_HOSTNAME env var deploy/Caddyfile already reads for its own
  # {$DASHBOARD_HOSTNAME} site -- a real production outage (every
  # dashboard SPA /api/* call 400'd) was caused by the api service never
  # seeing this value at all: Caddy's reverse_proxy passes the dashboard
  # site's own Host header through unchanged on every /api/* call, and
  # app/main.py's TrustedHostMiddleware had nothing but API_HOSTNAME to
  # compare it against. Same ":-" treatment as API_HOSTNAME above.
  DASHBOARD_HOSTNAME: ${DASHBOARD_HOSTNAME:-}
  # [SECURITY] L1 PART C (#7): Caddy's own compose service name -- the
  # DNS hostname app/client_ip.py resolves to decide which immediate TCP
  # peer is trusted to set X-Forwarded-For/X-Real-IP. Baked-in literal
  # default "caddy" (not ":-", matching deploy/docker-compose.prod.yml's
  # own UPLOAD_MAX_SIZE_BYTES precedent and its header comment on why: an
  # explicitly-empty env value is "set to empty", not "unset", to
  # Compose's own interpolation, so an operator who leaves this var out
  # of .env entirely still gets the real default here, not an empty
  # string that would disable the trust boundary outright).
  TRUSTED_PROXY_HOSTNAME: ${TRUSTED_PROXY_HOSTNAME:-caddy}

# [SECURITY] L2 follow-up (advisor review, 2026-10-18): a REAL finding,
# fixed -- DATABASE_URL_MIGRATE (the OWNER role's own password) used to
# live in x-app-env above, which api and worker ALSO merge in; a
# compromised api or worker process could then read the OWNER
# credentials straight out of its own environment and reconnect as the
# schema owner (DDL, owner rights on audit_log, the REVOKE bypassed),
# defeating the role split. migrate is the ONLY service that extends
# this -- api/worker's own `environment: *app-env` below never sees this
# key at all. Settings.database_url_migrate is Optional for exactly this
# reason (app/config.py's own field comment): api/worker's Settings()
# construction must succeed without it.
x-migrate-env: &migrate-env
  <<: *app-env
  DATABASE_URL_MIGRATE: ${DATABASE_URL_MIGRATE:?DATABASE_URL_MIGRATE must be set in .env}

# Hardening applied to api, worker and migrate only (our own code running
# the widgetplatform-backend image): read-only root filesystem with a tmpfs
# /tmp, all Linux capabilities dropped, no-new-privileges, and memory/pid
# limits. Not applied to postgres, qdrant or test-db, which are upstream
# images we did not audit for read-only-rootfs compatibility.
x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  mem_limit: 512m
  pids_limit: 200

# Same build, same image, for api, worker and migrate (duplication check
# after 1.1.g/h/i): one context, one tag, merged into each service below.
x-app-build: &app-build
  build:
    context: ../backend
  image: widgetplatform-backend:dev

# Shared by every healthcheck below; each service still supplies its own
# test: and merges this in for the timing (duplication check after 1.1.i).
x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 5s
  retries: 5

# postgres and test-db must always run the same Postgres version (test-db
# exists to mirror postgres for backend/tests); one anchor keeps that true
# by construction instead of by two people remembering to update both.
x-postgres-image: &postgres-image postgres:18.2-trixie

services:
  postgres:
    # Tag verified with `docker manifest inspect postgres:18.2-trixie`
    # (returned a valid manifest list) on 2026-09-20; same tag CI and the
    # Alembic integration test (1.1.h) already use.
    image: *postgres-image
    # POSTGRES_USER/PASSWORD/DB are applied only when the data volume is
    # first created; changing them later needs "down -v" (destroys data)
    # or changing the role password inside Postgres directly.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      # postgres:18.2-trixie declares its VOLUME at /var/lib/postgresql (not
      # the pre-18 .../data path) and sets PGDATA to a subdirectory of it
      # (/var/lib/postgresql/18/docker) -- verified with
      # `docker image inspect postgres:18.2-trixie --format
      # '{{json .Config.Volumes}}'` and `--format '{{json .Config.Env}}'`.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ escapes Compose's own interpolation so the literal shell
      # variables (set via environment: above) are read inside the
      # container, not substituted by Compose from the host's .env.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      <<: *healthcheck-timing
    restart: unless-stopped
    # No published ports: only other Compose services reach postgres, over
    # the default network, by service name.

  qdrant:
    # Newest stable tag verified via the Docker Hub tags API (v1.19.1 is the
    # highest vX.Y.Z tag as of 2026-09-20, i.e. not a dev/preview/branch
    # tag) and then with `docker manifest inspect qdrant/qdrant:v1.19.1`
    # (returned a valid manifest list).
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env}
      # Task 3.1.b: a SECOND, genuinely server-enforced key for retrieve()'s
      # own read path -- confirmed live against this exact pinned image
      # that Qdrant rejects a write through this key with its own 403,
      # not merely an application-level convention. See app/qdrant.py's
      # get_qdrant_read_client()'s own docstring for the full proof.
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:?QDRANT_READ_ONLY_API_KEY must be set in .env}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # /healthz is exempt from Qdrant's own API-key auth (confirmed live,
      # Task 1.3.a1: it answers 200 with no key, a wrong key, or the right
      # key -- unlike a real data endpoint like /collections, which returns
      # 401 without the correct key), so this check needs no change now
      # that auth is enabled.
      # The image has neither curl nor wget (checked with `which` inside
      # the image); it does have bash, so the check speaks raw HTTP to
      # qdrant's own /healthz endpoint over bash's /dev/tcp. CMD (not
      # CMD-SHELL) invokes bash directly: the image's /bin/sh is dash,
      # which does not support /dev/tcp. Revisit if the image drops bash.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'",
        ]
      <<: *healthcheck-timing
    restart: unless-stopped
    # No published ports: only other Compose services reach qdrant, over
    # the default network, by service name.

  phoenix:
    # Step 4.5 [SECURITY, Felix's own direct instruction]: self-hosted
    # Phoenix (docs/SPEC.md §14's own named service). Verified with
    # `docker manifest inspect arizephoenix/phoenix:version-20.22.0-
    # nonroot` (returned a valid manifest list) -- the "version-X.Y.Z"
    # tag form, confirmed against the real Docker Hub tags API to be
    # the explicit, intentional pin for this exact release (not a
    # floating "20"/"20.22" tag); "-nonroot" matches this project's own
    # established non-root-container discipline (api/worker/migrate
    # already run as uid 10001, Task 1.1.g).
    image: arizephoenix/phoenix:version-20.22.0-nonroot
    environment:
      # Confirmed live against Arize's own self-hosting docs: the real
      # mechanism behind docs/SPEC.md §13's own "stored for 30 days,
      # then auto-deleted" -- defaults to 0 (infinite retention)
      # otherwise, which would silently keep trace text forever.
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "30"
      # Explicit, absolute path -- not left to default to "~/.phoenix",
      # which resolves against whatever HOME the image's own non-root
      # user happens to have (not independently confirmed here); an
      # explicit path removes that ambiguity and gives the named volume
      # below an unambiguous mount target.
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    ports:
      # [SECURITY, Felix's own direct instruction]: bound to loopback
      # ONLY -- never routed through Caddy, and no entry for this
      # service exists (or should ever exist) in any Caddyfile this
      # project writes. An operator reaches the Phoenix UI by SSH-
      # tunneling to the host first, e.g.:
      #   ssh -L 6006:127.0.0.1:6006 <user>@<host>
      # then opening http://127.0.0.1:6006 in a local browser -- never
      # by a public DNS name. Same "127.0.0.1:PORT:PORT" shape as the
      # api service's own binding below.
      - "127.0.0.1:6006:6006"
    healthcheck:
      # No documented /healthz-shaped path was confirmed for this image
      # (checked against Arize's own docs before writing this) -- a
      # plain TCP-connect check to the UI/OTLP port, the same /dev/tcp
      # mechanism qdrant's own healthcheck above already uses (bash is
      # present on this image's own base; curl/wget not confirmed).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6006",
        ]
      <<: *healthcheck-timing
    restart: unless-stopped

  api:
    <<: [*app-build, *app-hardening]
    command: ["api"]
    environment: *app-env
    volumes:
      # Task 2.7.a: uploaded-file storage (app/ingest/upload_storage.py),
      # shared with worker below at the identical path -- confirmed live
      # before this task that api/worker shared no volume at all until
      # now. Same path as Settings.upload_storage_path's own default, so
      # no UPLOAD_STORAGE_PATH override is needed for this to line up.
      # Not a bind mount: a named volume needs no host-side directory to
      # pre-exist, matching postgres-data's/qdrant-data's own precedent.
      - upload-storage:/data/uploads
    ports:
      # Host side fixed at 8000, bound to loopback only: nothing outside
      # this machine can reach the API directly (a reverse proxy is a later
      # deployment task).
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      # The image has no curl (Task 1.1.g); Python's stdlib urllib is
      # already on PATH via the app's own venv, so no extra tool is needed.
      # Task 1.4.j: checks /ready, not /health -- /ready actually touches
      # Postgres (a bounded "SELECT 1", app/health.py), so this healthcheck
      # now reflects whether the api service can actually serve a request
      # that needs the database, not just that the process is alive.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).status == 200 else 1)",
        ]
      <<: *healthcheck-timing
    restart: unless-stopped

  worker:
    <<: [*app-build, *app-hardening]
    command: ["worker"]
    environment: *app-env
    volumes:
      # Task 2.7.a: same shared volume as api's own above, same path --
      # see that comment for why. This is what makes it SHARED: both
      # services mount the identical named volume at the identical path.
      - upload-storage:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      # The worker has no HTTP server (unlike the api service's own /ready
      # above), so this checks a file-based heartbeat instead (Task 2.1.f):
      # app/worker.py's own run() loop writes HEARTBEAT_PATH at the start
      # of every iteration, including an idle one with nothing to claim.
      # Same no-curl-in-the-image convention as api's own healthcheck --
      # one shared function, check_heartbeat_fresh(), not duplicated
      # shell-script freshness logic that could drift from the real one.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import sys; from app.worker import check_heartbeat_fresh; sys.exit(0 if check_heartbeat_fresh() else 1)",
        ]
      # NOT *healthcheck-timing (found live, 2026-10-16, diagnosing a
      # real "unhealthy" worker after a forced Docker restart): `import
      # app.worker` pulls in this project's own heaviest transitive
      # dependency tree (fastembed/onnxruntime, langchain, etc.) through
      # the full `app` package -- timed directly inside this exact
      # container, 5 consecutive cold-process runs of this literal
      # command took 5.4-5.8s EVERY time, already exceeding
      # *healthcheck-timing's shared 5s timeout with no margin at all,
      # unlike the api service's own healthcheck (urllib only, no
      # `app.worker` import, ~0.5-0.65s measured the same way) -- a
      # structural timeout-margin defect, not a transient engine hiccup:
      # any ordinary cold-cache moment (a fresh container start, a
      # restart, brief CPU contention) tips an inherently ~5.5s check
      # over a 5s timeout. Interval/timeout widened well past the
      # observed worst case; retries kept lower (3, not 5) since each
      # individual check now has real margin instead of relying on
      # repetition to average out a too-tight timeout.
      interval: 15s
      timeout: 15s
      retries: 3
    restart: unless-stopped

  migrate:
    <<: [*app-build, *app-hardening]
    command: ["migrate"]
    environment: *migrate-env
    # Not part of `up`: this is a deploy step, run explicitly with
    #   docker compose --env-file .env -f deploy/docker-compose.yml run --rm migrate
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      # Task 2.1.g: migrate now also runs ensure_collection() (app/qdrant.py)
      # after `alembic upgrade head`, so it needs qdrant healthy too, same as
      # api/worker below -- otherwise `docker compose run --rm migrate` run
      # before `up` (or standalone) would race a not-yet-ready Qdrant.
      qdrant:
        condition: service_healthy
    restart: "no"

  # [SECURITY] L2 (Phase 7 role split, 2026-10-18): a ONE-TIME, idempotent
  # admin step (app/db_provisioning.py), run explicitly, never part of
  # `up` and never chained into `migrate` above -- BOOTSTRAP credentials
  # (POSTGRES_USER/PASSWORD/DB, the real Postgres superuser) must never be
  # part of api/worker/migrate's own x-app-env, only this service's own
  # separate environment: block. See docs/deploy/RUNBOOK.md for the real
  # fresh-volume/existing-volume commands and rollback path.
  #   docker compose --env-file .env -f deploy/docker-compose.yml \
  #     run --rm provision-roles
  provision-roles:
    <<: *app-build
    command: ["provision-roles"]
    profiles: ["tools"]
    environment:
      # [SECURITY] L2 follow-up (2026-10-18): app/db_provisioning.py
      # refuses placeholder/weak passwords under APP_ENV=production, and
      # requires APP_ENV set (fail closed, never a silently skipped gate).
      APP_ENV: ${APP_ENV:?APP_ENV must be set in .env}
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      # Parsed for their embedded username/password only -- app/db_
      # provisioning.py never makes a real connection with either DSN as-
      # is (it connects as BOOTSTRAP, above, for everything).
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DATABASE_URL_MIGRATE: ${DATABASE_URL_MIGRATE:?DATABASE_URL_MIGRATE must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  test-db:
    # Same pinned image as postgres above; a separate, disposable instance
    # for backend/tests' integration tests (Task 1.1.h), never used by
    # api/worker/migrate.
    image: *postgres-image
    profiles: ["test"]
    environment:
      # Test-only credentials, written literally (not from .env): this
      # database is throwaway, localhost-only, and never holds real data.
      POSTGRES_USER: widgetplatform
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: widgetplatform_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      # Same path as postgres's named volume above (the image's declared
      # VOLUME) -- tmpfs instead of a named volume, so nothing persists
      # across restarts.
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widgetplatform -d widgetplatform_test"]
      <<: *healthcheck-timing
    restart: "no"

  # [SECURITY] L2 (Phase 7 role split, 2026-10-18): the identical one-time
  # provisioning step the real postgres service needs (see provision-roles
  # above), pointed at test-db instead -- test-db is tmpfs-backed (fresh on
  # every `up`), so this must run every time, never just once. Wired into
  # the Makefile's own test-db target, right after the pg_isready wait.
  # Test-only credentials, written literally (not from .env), same
  # "throwaway, localhost-only, never real data" convention test-db's own
  # POSTGRES_USER/PASSWORD above already uses -- these three ALSO match
  # backend/tests/conftest.py's own _LOCAL_DOCKER_RUN_HINT and backend/
  # app/db_provisioning.py's own OWNER_ROLE/APP_ROLE constants.
  provision-roles-test:
    <<: *app-build
    command: ["provision-roles"]
    profiles: ["test"]
    environment:
      APP_ENV: test
      PGHOST: test-db
      PGPORT: "5432"
      POSTGRES_USER: widgetplatform
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: widgetplatform_test
      DATABASE_URL: postgresql+psycopg://widgetplatform_app:change-me-app@test-db:5432/widgetplatform_test
      DATABASE_URL_MIGRATE: postgresql+psycopg://widgetplatform_owner:change-me-owner@test-db:5432/widgetplatform_test
    depends_on:
      test-db:
        condition: service_healthy
    restart: "no"

  test-qdrant:
    # Same tag as qdrant above, but written as a literal, not the anchor
    # pattern postgres/test-db use: qdrant has no second in-file consumer of
    # this tag, and the 1.1.o.g Dependabot bug (its docker-compose updater
    # cannot rewrite a YAML-anchored image line, "Expected content to
    # change!") is reason enough on its own to avoid anchors here even if
    # there were one. Task 1.3.a2's guard test (backend/tests/
    # test_hardening_guard.py) is the actual drift protection, checking this
    # literal against qdrant's own literal above.
    image: qdrant/qdrant:v1.19.1
    profiles: ["test"]
    environment:
      # Test-only key, written literally (not from .env): this Qdrant is
      # throwaway, localhost-only, and never holds real data -- same spirit
      # as test-db's literal Postgres credentials above.
      QDRANT__SERVICE__API_KEY: test-qdrant-key
      # Task 3.1.b: a second, genuinely different test-only key, so live
      # tests can exercise the real read-only/read-write distinction
      # against this exact server, not just construct two clients with
      # the same underlying permission.
      QDRANT__SERVICE__READ_ONLY_API_KEY: test-qdrant-readonly-key
    ports:
      - "127.0.0.1:56333:6333"
    tmpfs:
      # Same path as qdrant's named volume above (its declared VOLUME) --
      # tmpfs instead of a named volume, so nothing persists across restarts.
      - /qdrant/storage
    healthcheck:
      # Same check as qdrant above (/healthz is auth-exempt either way).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'",
        ]
      <<: *healthcheck-timing
    restart: "no"

volumes:
  postgres-data:
  qdrant-data:
  phoenix-data:
  # Task 2.7.a: shared between api and worker only (not migrate -- it
  # never touches uploads); named, not bind-mounted, matching the two
  # volumes above.
  upload-storage:
