# evals/golden_set/items.yaml
# Task 3.7.b: the golden set itself -- synthetic-corpus half only (the
# company-site half comes later, once Felix provides the real URL; see
# PROJECT_SPEC.md's own §9 marker, owner: whoever onboards the first
# real pilot tenant). Validated by backend/app/evals/golden_set.py's
# strict pydantic schema (extra="forbid", per-category cross-field
# rules) -- a malformed entry here fails loudly at load time, never
# silently ignored.
#
# Every `evidence_passage` below is a VERBATIM substring of the real,
# ingested text of the named document in evals/golden_set/synthetic_
# corpus.json (produced by backend/scripts/manual_build_golden_set_
# synthetic_corpus.py from the raw pages under evals/golden_set/pages/,
# run through the real extraction/chunking/embedding path) -- including
# this corpus's own deliberate typos, where the evidence passage quotes
# a typo'd sentence. Never a chunk id: re-chunking the corpus re-resolves
# every passage to whichever chunk(s) now contain it, instead of
# silently breaking (see golden_set.py's own module docstring).
#
# Item-writing rules followed (stated here once, not per item):
#   - Questions paraphrase the corpus's own wording rather than quoting
#     it, except where a question is itself an exact greeting/thanks
#     phrase (category=greeting) -- that category's own expected_route
#     depends on an EXACT, already-built match against app/agent/phrases/
#     greeting_phrases.yaml, which is a fixed-phrase lookup, not fuzzy
#     matching, so paraphrasing or adding typos there would make the
#     item's own expected_route wrong, not just harder.
#   - Visitor-style phrasing (short, informal, real typos: "u", "whats",
#     "yall", "mpesa" uncapitalized, dropped apostrophes) appears
#     throughout every other category.
#   - Every one of the corpus's 11 documents is referenced by at least
#     one item somewhere in this file (checked mechanically by
#     test_golden_set.py, not just asserted here).
items:
