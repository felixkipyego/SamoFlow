# Grype ignore rules for the widgetplatform-backend image scan
# (.github/workflows/security.yml). Loaded via that workflow's explicit
# `config: ${{ github.workspace }}/.grype.yaml` input, not auto-detection
# (auto-detection proved unreliable in a real run; see PROJECT_SPEC.md,
# Step 1.1.o.f follow-up).
ignore:
  # CVE-2026-82049 (High), python 3.12.14: no 3.12.x/3.13.x patch exists yet
  # (fixed only in 3.14.0b1), and the vulnerable tarfile-extraction code
  # path is unreachable in this image (pip is removed from both Pythons).
  # Re-evaluate on the next Python base image bump. Full investigation:
  # PROJECT_SPEC.md, Step 1.1.o.f decisions.
  - vulnerability: CVE-2026-82049
    package:
      name: python
      version: 3.12.14
      type: binary
    reason: >-
      No 3.12.x/3.13.x patch exists yet (fixed only in 3.14.0b1); the
      vulnerable tarfile-extraction code path is not reachable in this
      image (pip, the plausible caller, is removed from both Pythons).
