# Grype ignore rules for the widgetplatform-backend image scan
# (.github/workflows/security.yml). Loaded via that workflow's explicit
# `config: ${{ github.workspace }}/.grype.yaml` input, not auto-detection
# (auto-detection proved unreliable in a real run; see PROJECT_SPEC.md,
# Step 1.1.o.f follow-up).
#
# 2026-10-24 (Felix's decision, D-pillow-audit-ignores): pillow 12.3.0's
# findings that correspond to the APPROVED pip-audit IDs in the Makefile's
# PILLOW_AUDIT_IGNORES -- see that list's own comment for why pillow 13
# cannot be installed and why pillow is unreachable from tenant input.
# Every rule is scoped to vulnerability + package name + version 12.3.0 +
# type python, so it stops applying the moment pillow's version changes
# (confirmed live: a rule scoped to another version suppresses nothing).
# Grype keys these advisories by GHSA ID and, confirmed live on grype
# v0.119.0, does NOT match a rule written with the related CVE ID -- so
# each rule names the GHSA ID, and `reason` names the approved CVE it maps
# to. test_grype_guard.py fails if any rule's CVE is not in the Makefile
# list, or if the two lists drift.
#
# 35 rules, not 37: two approved IDs (CVE-2026-112398, CVE-2026-114501)
# are not in Grype's database at all, so there is nothing to ignore here.
# Grype ALSO reports pillow advisories pip-audit does not (see the task
# report) -- those are deliberately NOT ignored: a new pillow finding must
# fail the scan until Felix approves it.
ignore:
  - vulnerability: GHSA-22hg-r758-rrw9
    package:
      name: pillow
      version: 12.3.0
      type: python
    reason: "CVE-2026-112390 -- pillow 12.3.0, unreachable from tenant input (D-pillow-audit-ignores)"
  - vulnerability: GHSA-24rc-8hj2-v98c
    package:
      name: pillow
      version: 12.3.0
      type: python
    reason: "CVE-2026-96638 -- pillow 12.3.0, unreachable from tenant input (D-pillow-audit-ignores)"
