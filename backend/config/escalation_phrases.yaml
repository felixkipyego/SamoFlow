  - phrase: connect me to a person
    category: asks_for_person
    golden_ref: "manual:asks_for_person:connect_me_to_a_person"
  - pattern: '\b(talk|speak|chat)\s+(to|with)\s+(a\s+|an\s+)?(real\s+|live\s+|actual\s+)?(human|person|agent|representative|rep)\b'
    category: asks_for_person
    golden_ref: "manual:asks_for_person:pattern_talk_speak_to_human"
  - pattern: '\b(connect|transfer|put)\s+me\s+(through\s+)?(to|with)\s+(a|an|your)\s+(human|person|agent|representative|manager|supervisor)\b'
    category: asks_for_person
    golden_ref: "manual:asks_for_person:pattern_connect_transfer_me"
  - pattern: '\bcan\s+(i|you)\s+(talk|speak)\s+to\s+(a\s+|an\s+)?(human|person|agent|representative|someone)\b'
    category: asks_for_person
    golden_ref: "manual:asks_for_person:pattern_can_i_speak_to"
  - pattern: '\bi\s+(need|want|would like)\s+to\s+(talk|speak)\s+to\s+(a\s+|an\s+)?(human|person|agent|representative|someone|manager)\b'
    category: asks_for_person
