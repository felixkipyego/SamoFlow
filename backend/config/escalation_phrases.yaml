  - phrase: human representative
    category: asks_for_person
    golden_ref: "manual:asks_for_person:human_representative"
  - phrase: customer service rep
    category: asks_for_person
    golden_ref: "manual:asks_for_person:customer_service_rep"
  - phrase: customer service representative
    category: asks_for_person
    golden_ref: "manual:asks_for_person:customer_service_representative"
  - phrase: talk to your manager
    category: asks_for_person
    golden_ref: "manual:asks_for_person:talk_to_your_manager"
  - phrase: speak to a manager
    category: asks_for_person
    golden_ref: "manual:asks_for_person:speak_to_a_manager"
  - phrase: speak to your supervisor
    category: asks_for_person
    golden_ref: "manual:asks_for_person:speak_to_your_supervisor"
  - phrase: get me a human
    category: asks_for_person
    golden_ref: "manual:asks_for_person:get_me_a_human"
  - phrase: is there a human
    category: asks_for_person
    golden_ref: "manual:asks_for_person:is_there_a_human"
  - phrase: not a bot
    category: asks_for_person
    golden_ref: "manual:asks_for_person:not_a_bot"
  - phrase: stop talking to a bot
