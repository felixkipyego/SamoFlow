# backend/config/escalation_phrases.yaml
# Step 4.4: docs/SPEC.md §7's own escalation trigger-phrase file --
# "the phrases live in a YAML file in the backend config folder (English
# only, roughly 50 to 200 entries; each entry has a phrase or pattern, a
# category of asks-for-a-person, complaint or negative, and a reference
# to its golden-set test). It is loaded at startup and validated against
# a schema in the tests." Mirrors config/greeting_phrases.yaml's own
# shape (Task 3.4.f), which itself was written anticipating this exact
# file -- see that file's own header comment.
#
# UNLIKE greeting_phrases.yaml (exact-match only, each message is either
# a greeting or it isn't): escalation intent needs to be found EMBEDDED
# in a longer, real sentence ("I really need to talk to a human about
# this") -- a bare exact-match rule would miss almost every real
# message. Each entry therefore carries EXACTLY ONE of:
#   - `phrase`: matched as a whole-word, case-insensitive SUBSTRING of
#     the visitor's message (word-boundaried so "class" never matches
#     "ass" -- see app/agent/escalation_phrases.py's own matching rule).
#   - `pattern`: a Python `re` pattern (case-insensitive, `re.search`),
#     for phrasings a flat phrase list covers poorly (e.g. "speak to a
#     human" / "speak with a human" / "speak to a real person" as one
#     rule instead of a dozen near-identical phrases).
#
# `golden_ref`: docs/SPEC.md names this per-entry requirement, but no
# golden-set CATEGORY for routing/escalation phrases exists yet
# (app/evals/golden_set.py's own `Route` literal is `answer`/
# `gate_fallback`/`greeting` only -- confirmed by reading it directly,
# not assumed). A deliberate, named scope decision, not silently worked
# around: `golden_ref` below is a descriptive label only (NOT a live
# foreign key into any golden-set loader) until that category is built.
# See PROJECT_SPEC.md's own new §9 marker (owner: whoever next extends
# the golden set) for the real follow-up.
entries:
  # --- asks_for_person ---------------------------------------------
  - phrase: talk to a person
    category: asks_for_person
    golden_ref: "manual:asks_for_person:talk_to_a_person"
  - phrase: speak to a person
    category: asks_for_person
    golden_ref: "manual:asks_for_person:speak_to_a_person"
  - phrase: speak to someone
    category: asks_for_person
    golden_ref: "manual:asks_for_person:speak_to_someone"
  - phrase: talk to someone
    category: asks_for_person
    golden_ref: "manual:asks_for_person:talk_to_someone"
