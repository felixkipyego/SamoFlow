# backend/pyproject.toml
# Defines the `widgetplatform` backend package: metadata, pinned dependencies,
# and tool config for ruff (lint) and pytest (test).
#
# Version pins below were looked up on PyPI on 2026-09-19 (not recalled from
# memory) and are newer than the December 2024 pins first recorded in
# PROJECT_SPEC.md. See the task report for what changed between the old and
# new pins.

[build-system]
# hatchling approved as a build-time-only dependency (not installed at
# runtime); version verified on PyPI 2026-09-19.
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "widgetplatform"
version = "0.1.0"
description = "SamoFlow embeddable agentic AI widget platform — backend"
requires-python = "==3.12.*"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic-settings==2.15.0",
    "alembic==1.20.0",
    "sqlalchemy==2.0.54",
    "psycopg[binary]==3.3.6",
    # Task 1.3.b. Version matches the pinned server image tag
    # (qdrant/qdrant:v1.19.1, Task 1.1.i) exactly -- Qdrant releases client
    # and server in lockstep specifically so users pin matching versions;
    # review both together whenever either is bumped (see PROJECT_SPEC.md's
    # manual dependency/image maintenance routine).
    "qdrant-client==1.19.1",
    # Task 1.4.b. HS256 only (docs/SPEC.md §4.3) needs no extra -- the
    # `crypto` extra (pulling in `cryptography`) is only required for
    # asymmetric algorithms (RS/ES*), not used here.
    "pyjwt==2.15.1",
    # Task 2.2.d. Version re-verified live on PyPI at build time (not
    # assumed from this planning session), matching every prior pin's own
    # precedent. Python's stdlib has no TXT-record query capability at all
    # (socket.getaddrinfo resolves A/AAAA only) -- this is a new
    # capability, not a replacement for anything. No extra: the base
    # install has zero required dependencies of its own (confirmed live
    # against PyPI's own metadata) -- `dnssec`/`doh`/`doq`/`trio` are all
    # optional extras this project needs none of, since it only ever
    # issues a plain TXT query over the system's own configured
    # resolver(s), nothing DNSSEC- or DoH-related.
    "dnspython==2.8.0",
    # Task 2.3.c. Promoted from dev-only to a direct runtime dependency --
    # version re-verified live on PyPI at this task's own build time (still
    # 0.28.1, unchanged since it was first approved as a dev dependency at
    # Step 1.1.a), not assumed from the existing pin. The safe-fetch
    # primitive needs `extensions={"sni_hostname": ...}` (httpcore's own
    # mechanism, confirmed real by reading its installed source at the
    # Step 2.3 research stage) to connect to a validated IP literal while
    # still sending the correct Host header and TLS SNI/certificate
    # verification for the original hostname -- a capability this project
    # did not need from httpx before this task, only as a test client.
    "httpx==0.28.1",
    # Task 2.4.b. Version re-verified live on PyPI at this task's own build
    # time, matching the Step 2.4 decision entry's approval in principle --
    # not assumed from that planning session. beautifulsoup4 is the HTML
    # parse/query layer; lxml is its parser backend (prebuilt cp312 wheels
    # confirmed on manylinux and macOS -- no sdist-only build, no extra
    # system libxml2/libxslt packages needed in the Docker image).
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    # Task 2.4.c. Version re-verified live on PyPI at this task's own build
    # time. Has a Rust extension, but ships prebuilt cp312 wheels (confirmed
    # on manylinux_2_28 x86_64/aarch64 and macOS) -- no Rust toolchain
    # needed in the Docker image, not an sdist-only build.
    "tiktoken==0.14.0",
    # Task 2.4.d. Version re-verified live on PyPI at this task's own build
    # time. Pure Python (py3-none-any wheel only, no platform-specific
    # wheels at all since there is nothing to compile) -- part of why this
    # was chosen over PyMuPDF (the other reason: PyMuPDF's AGPL/commercial
    # dual license, Step 2.4 decision (a)). Its own declared dependency
    # (typing_extensions) is conditional on python_version < "3.11", so it
    # resolves to zero required dependencies on this project's 3.12 pin.
    "pypdf==6.19.0",
    # Task 2.4.e. Version re-verified live on PyPI at this task's own build
    # time. Pure Python (py3-none-any wheel only). Its own dependencies
    # (lxml>=3.1.0, typing_extensions>=4.9.0) are both already satisfied by
    # existing pins (lxml==6.1.3 from Task 2.4.b), so no new transitive
    # package is expected.
    "python-docx==1.2.0",
    # Task 2.5.a. Version re-verified live on PyPI at this task's own build
    # time. A pure-Python wheel itself, but confirmed live (reading the
    # real wheel's own METADATA, not a summarized fetch) to depend on
    # httpx2/httpcore2 -- httpx's own official successor, a SEPARATE
    # package from the httpx==0.28.1/httpcore stack already pinned here
    # (Task 2.3.c) -- plus jiter (a Rust-accelerated JSON parser). A
    # second, parallel HTTP-client stack, not a replacement of the first;
    # recorded as a known footprint consequence, not a defect.
    "openai==3.24.0",
    # Task 2.5.b. Version re-verified live on PyPI at this task's own build
    # time. NOT pure Python despite its own wheel being py3-none-any -- it
    # pulls in onnxruntime, numpy, tokenizers and py-rust-stemmers (both
    # Rust-backed), pillow. The heaviest dependency footprint added to
    # this project so far. See onnxruntime's own pin immediately below
    # for a real resolution problem this surfaced and fixed.
    "fastembed==0.8.1",
    # Task 2.5.b, pinned directly as its own fix (found live, not
    # assumed): fastembed's own declared range let uv's --universal
    # resolver pick onnxruntime's newest version (1.30.0), but onnxruntime
    # dropped macOS x86_64 wheels entirely starting at 1.24.0 (confirmed
    # directly against PyPI's raw simple index -- only arm64 macOS wheels
    # exist from 1.24.0 onward). This made `pip install --require-hashes`
    # genuinely fail on this project's own macOS x86_64 dev machine --
    # confirmed live by actually running it, not inferred -- even though
    # the Linux/Docker production target was never affected (real
    # manylinux_2_28 wheels exist for 1.30.0 on both x86_64/aarch64).
    # 1.23.2 is the last version with macOS x86_64 wheels, confirmed with
    # full coverage (macOS arm64+x86_64, manylinux x86_64+aarch64,
    # Windows), and satisfies fastembed==0.8.1's own declared constraint
    # for Python 3.12 (>=1.17.0,!=1.20.0,!=1.24.0,!=1.24.1). Matches the
    # platformdirs/charset-normalizer precedent: pin a transitive
    # dependency directly when the resolver's own pick causes a real
    # problem, rather than leaving it to chance. A plain dependencies-
    # list pin alone is not sufficient to make this take effect -- see
    # the Makefile's own UV_COMPILE variable, extended with --overrides
    # for exactly this entry, and the matching PROJECT_SPEC.md decision
    # entry for why a marker-scoped pin could not resolve this cleanly.
    "onnxruntime==1.23.2",
    # Task 2.6.e. Version re-verified live on PyPI at this task's own
    # build time. Escalated from stdlib urllib.robotparser, per the Step
    # 2.6 decision entry's own pre-authorized escalation path, after
    # confirming live (not assumed) that stdlib's robots.txt parser does
    # not implement the de-facto `*`/`$` wildcard extensions most
    # real-world robots.txt files rely on (Google/Bing's own convention,
    # shipped by default by most major CMS platforms) -- it treats `*`/
    # `$` inside a Disallow/Allow path as literal characters, confirmed
    # to silently mis-classify common real patterns
    # (`/*.pdf$`, `/search?*`, `/tmp*`) as non-matching ("allowed") when
    # real site owners intend them to block. protego (Scrapy's own
    # robots.txt library) correctly handles all of these, confirmed live
    # in a throwaway venv before adding it here. Zero dependencies of its
    # own (confirmed against PyPI's real metadata) and ships a single
    # pure-Python py3-none-any wheel -- no new transitive package, no
    # compiled-extension risk.
    "protego==0.7.0",
    # Task 2.8.a. Version re-verified live on PyPI at this task's own
    # build time (0.32.0 is current, confirmed via `pip index versions`).
    # Postgres-only for Step 2.8 (MySQL/MariaDB explicitly deferred, see
    # PROJECT_SPEC.md's Step 2.8 decision log) -- async-first, matching
    # this project's own existing pattern (httpx/openai/fastembed are all
    # async-capable; psycopg[binary] is the one exception, used only for
    # this app's OWN internal database, a pre-2.3-SSRF-guard decision).
    # Prebuilt wheels confirmed for cp312 on both macOS x86_64 and
    # manylinux_2_28 x86_64 -- no C-compiler/build step needed in the
    # Docker image. Its own declared dependency (async_timeout) is
    # conditional on `python_version < "3.11.0"`, resolving to zero
    # required dependencies on this project's 3.12 pin (confirmed by
    # reading the installed wheel's own METADATA, not assumed).
    "asyncpg==0.32.0",
    # Task 3.2.b. Version re-verified live on PyPI at this task's own
    # build time (not copied from the 3.2.a research summary without
    # re-checking). langgraph-checkpoint-postgres provides AsyncPostgresSaver
    # (docs/SPEC.md §6.3); langgraph itself provides MessagesState/the
    # graph machinery Step 3.3 builds against. Both pull in
    # langgraph-checkpoint (resolves to 4.2.0) and, for the Postgres
    # package specifically, psycopg-pool (resolves to 3.3.3, new to this
    # project) -- confirmed live, in a throwaway venv, to require
    # psycopg>=3.2.0, satisfied cleanly by this project's own existing
    # psycopg==3.3.6 pin with zero conflict. langgraph's own tree pulls in
    # langchain-core (a non-trivial transitive dependency -- see
    # PROJECT_SPEC.md's dependency-footprint note for this task) plus
    # langgraph-prebuilt/langgraph-sdk/pydantic/xxhash.
    "langgraph==1.2.14",
    "langgraph-checkpoint-postgres==3.1.2",
    # Task 3.4.a. docs/SPEC.md §6.3's own "Models" bullet names
    # `init_chat_model` directly ("per-tenant config via `init_chat_model`,
    # with `.with_fallbacks()` to a secondary provider") -- confirmed live,
    # before pinning, that `init_chat_model` is NOT exposed by
    # `langchain-core` alone (already installed transitively via
    # `langgraph`): it lives in the separate `langchain` package, not
    # previously a dependency of this project. Ruled out calling the
    # `openai` SDK directly instead (this project's own established
    # embedding-side pattern): LangGraph's `stream_mode="messages"`
    # (docs/SPEC.md §10) only emits token chunks for calls that go through
    # a real `langchain_core.language_models.BaseChatModel` subclass's own
    # callback/event wiring -- a bare SDK call inside a node would never
    # surface through that stream mode, confirmed by reading how
    # `stream_mode="messages"` is implemented (it listens for LangChain's
    # own `on_llm_new_token` callback, not generic Python output).
    # Versions re-verified live on PyPI at this task's own build time:
    # `langchain==1.4.4` requires `langchain-core>=1.6.9,<2.0.0` and
    # `langgraph>=1.2.11,<1.3.0`, both already satisfied; `langchain-
    # openai==1.7.1`/`langchain-anthropic==1.7.6` both require
    # `langchain-core>=1.6.10,<2.0.0` -- one patch-level bump from the
    # currently-resolved 1.6.9 to 1.6.10 (confirmed available on PyPI,
    # still satisfies langgraph's own `<2,>=1.4.7` range). `langchain-
    # openai` requires `openai>=2.45.0,<4.0.0`, satisfied cleanly by this
    # project's own existing `openai==3.24.0` pin. `langchain-anthropic`
    # requires `anthropic>=0.120.0,<2.0.0` -- a genuinely NEW transitive
    # dependency (the real Anthropic Python SDK), not previously anywhere
    # in this project; pulled in even though the secondary provider is
    # optional at runtime (Q2) because the package itself must always be
    # IMPORTABLE for the fallback-chain construction code to exist at all
    # -- only its ACTUAL USE is conditional on `Settings.anthropic_api_key`
    # being set.
    "langchain==1.4.4",
    "langchain-openai==1.7.1",
    "langchain-anthropic==1.7.6",
    # Task 3.4.f: the greeting/thanks phrase-list loader (app/agent/
    # greeting_phrases.py) parses backend/config/greeting_phrases.yaml.
    # Already present transitively (pulled in by an existing dependency)
    # -- promoted to an explicit direct pin here deliberately: relying on
    # a transitive provider for a real, direct `import yaml` in
    # application code is fragile (a future upstream change dropping its
    # own use of PyYAML would silently stop pinning it, and this code's
    # own import would then break with no warning from `make lock-check`
    # until the exact moment it broke in production). Version re-verified
    # current on PyPI at this task's own build time, matching every
    # other dependency pin's own precedent.
    "pyyaml==6.0.3",
    # Task 4.1. docs/SPEC.md §10 names this library explicitly
    # ("EventSourceResponse (sse-starlette)") -- not a free choice among
    # alternatives, the spec already made this call. Version re-verified
    # live on PyPI at this task's own build time. Declares
    # starlette>=0.49.1/anyio>=4.7.0; both already satisfied by the
    # installed starlette==1.7.0/anyio==4.15.1 (transitive via
    # fastapi==0.141.1), so no new transitive package is expected.
    "sse-starlette==3.5.0",
    # Step 4.5: docs/SPEC.md §13 names these mechanisms explicitly --
    # "phoenix.otel.register", "OpenInference for LangChain/LangGraph",
    # "OpenTelemetry for FastAPI" -- not a free choice among
    # alternatives. Each confirmed live (installed and imported
    # successfully, real APIs checked directly, not assumed from
    # documentation) before this step's own code was written, matching
    # docs/SPEC.md §13's own "verify each instrumentor exists and is
    # maintained before relying on it" requirement. Versions re-verified
    # current on PyPI at this task's own build time.
    "arize-phoenix-otel==0.17.2",
    "openinference-instrumentation-langchain==0.1.79",
    # A pre-1.0 (beta, "b1") release -- confirmed this is the real,
    # current, intended version for this package specifically (the
    # wider opentelemetry-instrumentation-* family ships this way by
    # convention, unlike opentelemetry-api/-sdk themselves, which are
    # stable 1.x), not a stray pre-release accidentally picked up.
    "opentelemetry-instrumentation-fastapi==0.66b1",
    # Step 6.1 [SECURITY]: docs/SPEC.md §12's own direct instruction --
    # "use a maintained auth library rather than hand-rolling" -- and
    # Felix's own 2026-10-15 correction naming the pick explicitly.
    # fastapi-users is the maintained, actively-developed (15.0.5
    # current, re-verified live on PyPI at this task's own build time)
    # standard choice for a FastAPI+SQLAlchemy user/session stack: a
    # real user table adapter (SQLAlchemyUserDatabase), a pluggable
    # password-hashing layer already defaulting to argon2id, and a
    # pluggable session-storage strategy (DatabaseStrategy -- server-
    # side, revocable sessions, not JWT) this project extends (app/
    # dashboard/auth_backend.py's own HashedDatabaseStrategy) rather
    # than hand-rolls, for the two properties it does not provide out
    # of the box: hashing the stored token (its own default stores the
    # raw token, confirmed by reading DatabaseStrategy's own source
    # before adopting it) and idle expiry (its own `lifetime_seconds`
    # is absolute-only). The `[sqlalchemy]` extra pulls fastapi-users-
    # db-sqlalchemy (>=7.0.0, resolves to 7.0.0, the real adapter this
    # project's own Postgres-backed User/DashboardSession tables use).
    # Alternatives considered: Authlib (OAuth/OIDC-focused, the wrong
    # shape for a first-party email/password login); hand-rolling a
    # second time with only argon2-cffi (the literal thing docs/SPEC.md
    # §12 says not to do). Real, accepted footprint cost, not hidden:
    # fastapi-users' own hard (non-extra-gated) dependencies pull in
    # python-multipart and email-validator (used by its own OAuth2-
    # form/EmailStr-schema machinery, which this project's own routes
    # do not use -- see app/dashboard/routes.py's own header comment
    # for why custom JSON routes are built instead of its generated
    # routers) and, via its own `pyjwt[crypto]` requirement, a new
    # `cryptography` transitive package (unused here -- this project's
    # own widget JWT stays HS256-only via the already-pinned bare
    # `pyjwt`, docs/SPEC.md §4.3; fastapi-users' own JWT strategy is
    # never used, only its DatabaseStrategy).
    "fastapi-users[sqlalchemy]==15.0.5",
    # Pinned to the EXACT version fastapi-users==15.0.5 itself requires
    # (pwdlib[argon2,bcrypt]==15.0.5's own Requires-Dist -- a hard
    # `==0.3.0`, not a range, confirmed by reading that wheel's own
    # METADATA before pinning here, not guessed) -- a real, direct
    # `from pwdlib...import` exists in app/dashboard/passwords.py
    # (configuring the real argon2id parameters explicitly), matching
    # this project's own established "a real direct import earns its
    # own explicit pin" rule (pyyaml's own precedent, Task 3.4.f) rather
    # than relying on fastapi-users' own transitive pin alone.
    "pwdlib==0.3.0",
    # Step 6.1: argon2id password hashing (docs/SPEC.md §12), the
    # engine pwdlib's own Argon2Hasher wraps. Version re-verified live
    # on PyPI at this task's own build time (`pip index versions
    # argon2-cffi` -> 25.1.0). app/dashboard/passwords.py passes its
    # own parameters explicitly (time_cost=3, memory_cost=65536 KiB,
    # parallelism=4, type=Type.ID) -- comfortably above OWASP's 2026
    # minimum (memory>=19456 KiB, time>=2, parallelism>=1) -- rather
    # than relying on either library's own unstated default, so a
    # future upstream change cannot silently downgrade this project's
    # own parameters without the explicit values here also changing.
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    # Added 2026-10-15: a hang must fail fast with a stack trace, never
    # silently block for hours (a real multi-hour hang happened this same
    # week -- see PROJECT_SPEC.md's Part A decision-log entry). Current on
    # PyPI at this task's own build time (2.4.0, confirmed live via
    # `pip index versions`).
    "pytest-timeout==2.4.0",
    "ruff==0.16.8",
    "uv==0.12.19",
    "pip-audit==2.10.1",
    # Transitive dependency of pip-audit, pinned directly because upstream's
    # rapid patch releases otherwise left uv's resolution to whatever was
    # newest at compile time, making `make lock`/`lock-check` flap between
    # runs with no functional difference (never shipped in the production
    # image; --require-hashes verifies whichever version is pinned either way).
    "platformdirs==4.11.15",
    # Task 3.4.c (sanitiser redesign): a real CommonMark parser, used ONLY
    # in tests, to prove the answer-text escaping function against an
    # actual parse tree (image/link/raw-HTML token types) rather than
    # string inspection -- re-verified current on PyPI at this task's own
    # build time (4.2.0), not assumed. Dev-only, never ships in the
    # production image.
    "markdown-it-py==4.2.0",
    # Task 3.7.d: the groundedness judge (docs/SPEC.md §13's own
    # "phoenix.evals for hallucination and relevance"), confirmed current
    # on PyPI at this task's own build time (3.9.2, re-verified -- same
    # version researched at Task 3.7.a). Dev/eval-only, NEVER the
    # production lockfile or image -- enforced by `tests/test_pyproject.
    # py`'s own `test_eval_only_packages_never_appear_in_the_production_
    # lockfile`, written ahead of this addition at Task 3.7.a's own
    # follow-up specifically so this moment could not get it wrong
    # silently. Pulls in `pandas` (confirmed via PyPI's own
    # `requires_dist`, Task 3.7.a) -- the guard checks that name
    # specifically, not `numpy` (already a legitimate production
    # dependency via fastembed/onnxruntime; see that test's own comment).
    "arize-phoenix-evals==3.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
# The config-path bug fix (2026-10-16): app/agent/phrases/*.yaml is real
# package data now (escalation/greeting/rewrite-trigger phrase lists,
# loaded via importlib.resources, see each module's own header comment),
# not a backend/config/ sibling directory a plain `packages = ["app"]`
# wheel build would already include by default -- `include` here makes
# that non-default inclusion explicit instead of relying on hatchling's
# own default file-selection rules, which are not specific to data files
# and could change. Verified live (not assumed): `python -m build --wheel`
# + `unzip -l` on the built wheel confirms all three .yaml files are
# present under app/agent/phrases/.
include = ["app/agent/phrases/*.yaml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# ruff 0.16 expanded its default rule set from 59 to 413 rules; an explicit
# `select` is pinned here so future ruff upgrades don't silently change what
# CI enforces. E/F = pycodestyle+pyflakes errors, I = import sorting,
# UP = pyupgrade, B = bugbear, S = bandit (security).
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 = use of `assert`: normal and expected in test files.
"tests/*" = ["S101"]

[tool.pytest]
# Native TOML config table, new in pytest 9.0 (replaces [tool.pytest.ini_options]
# INI-string style). asyncio_mode = "auto" lets async def test_* functions run
# without per-test @pytest.mark.asyncio decorators.
minversion = "9.1"
addopts = ["-ra"]
testpaths = ["tests"]
asyncio_mode = "auto"
# Global per-test timeout (pytest-timeout), added 2026-10-15. Value is 2x
# the single largest explicit timeout anywhere in this suite -- the real
# subprocess alembic calls in test_alembic.py, timeout=30 -- confirmed by
# reading both call sites directly: each test invokes its subprocess
# helper exactly once (no chaining), so no test legitimately needs more
# than one 30s wait. 60s is generous without masking a genuine hang for
# hours. Long-running tests get an explicit `@pytest.mark.timeout(N)`
# override instead of raising this global.
timeout = "60"
